<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FIFA World Cup 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F1A;
    --bg-card: #131929;
    --bg-card2: #1A2236;
    --border: rgba(255,255,255,0.07);
    --accent: #00D4FF;
    --accent2: #4ADE80;
    --gold: #FFB800;
    --red: #FF4D4D;
    --text: #FFFFFF;
    --text2: #A0AECB;
    --text3: #5C6B8A;
    --radius: 14px;
    --bottom-nav-h: 68px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100%;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  /* ─── APP SHELL ─── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
  }

  /* ─── HEADER ─── */
  .app-header {
    flex-shrink: 0;
    background: linear-gradient(180deg, #060C18 0%, #0B0F1A 100%);
    padding: 12px 20px 0;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    padding-bottom: 14px;
  }
  .wc-logo {
    width: 56px; height: 56px;
    margin-bottom: 2px;
  }
  .wc-logo svg { width: 100%; height: 100%; }
  .header-title {
    font-size: 22px; font-weight: 800;
    letter-spacing: 0.5px;
    color: #fff;
    text-align: center;
    line-height: 1.1;
  }
  .header-title span { color: var(--gold); }
  .header-sub {
    font-size: 10px; font-weight: 600;
    color: var(--text3);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-align: center;
  }
  .live-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,77,77,0.12); border: 1px solid rgba(255,77,77,0.3);
    border-radius: 999px; padding: 3px 10px;
    font-size: 10px; font-weight: 700; color: var(--red);
    letter-spacing: 1.5px; margin-top: 6px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red); animation: blink 1.4s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ─── SCROLLABLE CONTENT ─── */
  .page-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 16px 16px calc(var(--bottom-nav-h) + 16px);
  }

  /* ─── PAGE VIEWS ─── */
  .page { display: none; }
  .page.active { display: block; }

  /* ─── SECTION LABELS ─── */
  .section-label {
    font-size: 11px; font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .day-block { margin-bottom: 24px; }
  .day-header {
    font-size: 11px; font-weight: 700;
    color: var(--text3);
    letter-spacing: 1.5px; text-transform: uppercase;
    padding: 6px 0 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 7px;
  }
  .day-header::before {
    content: '';
    display: inline-block;
    width: 3px; height: 12px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* ─── MATCH CARD ─── */
  .match-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative; overflow: hidden;
  }
  .match-card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent);
    border-radius: 2px 0 0 2px;
    opacity: 0.6;
  }
  .match-card.live::before { background: var(--red); opacity: 1; }
  .match-card:active { transform: scale(0.99); }
  .match-card-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .match-venue-txt {
    font-size: 11px; color: var(--text3);
    display: flex; align-items: center; gap: 4px;
    max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .match-venue-txt svg { width: 10px; height: 10px; flex-shrink: 0; }
  .status-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    padding: 3px 9px; border-radius: 999px;
    text-transform: uppercase;
  }
  .badge-upcoming { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.25); }
  .badge-live { background: var(--red); color: #fff; animation: livePulse 2s infinite; }
  .badge-final { background: rgba(255,255,255,0.06); color: var(--text3); }
  @keyframes livePulse {
    0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,0.4)}
    50%{box-shadow:0 0 0 5px rgba(255,77,77,0)}
  }
  .match-body {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }
  .team-left { display: flex; align-items: center; gap: 10px; }
  .team-right { display: flex; align-items: center; gap: 10px; flex-direction: row-reverse; }
  .team-flag-big { font-size: 30px; line-height: 1; flex-shrink: 0; }
  .team-detail-left { text-align: left; }
  .team-detail-right { text-align: right; }
  .t-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .t-code { font-size: 10px; color: var(--text3); letter-spacing: 1px; margin-top: 1px; }
  .score-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
    min-width: 90px;
  }
  .score-nums { font-size: 26px; font-weight: 800; letter-spacing: 3px; line-height: 1; }
  .score-nums.upcoming { font-size: 15px; font-weight: 600; letter-spacing: 1px; color: var(--text3); }
  .score-time-lbl { font-size: 10px; font-weight: 600; color: var(--gold); margin-top: 3px; }
  .match-times-row {
    display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap;
    padding-top: 10px; border-top: 1px solid var(--border);
  }
  .time-chip {
    display: flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 999px; padding: 4px 10px;
    font-size: 11px; color: var(--text2);
  }
  .time-chip strong { color: var(--text); }
  .group-chip {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    background: rgba(255,184,0,0.1); color: var(--gold);
    padding: 2px 7px; border-radius: 4px;
  }

  /* ─── STANDINGS ─── */
  .standing-block { margin-bottom: 16px; }
  .standing-group-hdr {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,184,0,0.07);
    border-left: 3px solid var(--gold);
    padding: 10px 14px;
    border-radius: 0 10px 10px 0;
    margin-bottom: 0;
  }
  .sg-title { font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: 1px; }
  .sg-cols { font-size: 11px; color: var(--text3); }
  .standing-table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 0 0 12px 12px;
    overflow: hidden;
  }
  .st-row {
    display: grid;
    grid-template-columns: 20px 1fr 28px 28px 28px 28px 28px 32px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    gap: 4px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .st-row:last-child { border-bottom: none; }
  .st-row:active { background: rgba(255,255,255,0.03); }
  .st-row.qualify { background: rgba(74,222,128,0.04); }
  .st-rank {
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
  }
  .st-rank.q { background: rgba(74,222,128,0.15); color: var(--accent2); }
  .st-rank.n { background: rgba(255,255,255,0.06); color: var(--text3); }
  .st-team { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; overflow: hidden; }
  .st-flag { font-size: 15px; flex-shrink: 0; }
  .st-tname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-num { font-size: 12px; color: var(--text2); text-align: center; }
  .st-pts { font-size: 13px; font-weight: 700; color: var(--text); text-align: center; }
  .qualify-note {
    font-size: 10px; color: var(--accent2); padding: 6px 14px;
    background: rgba(74,222,128,0.05);
    display: flex; align-items: center; gap: 4px;
  }

  /* ─── TEAMS ─── */
  .confed-section { margin-bottom: 24px; }
  .confed-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: rgba(255,255,255,0.03);
    border-left: 3px solid var(--accent);
    border-radius: 0 10px 10px 0;
    margin-bottom: 12px;
  }
  .confed-name-txt { font-size: 13px; font-weight: 700; color: var(--text); }
  .confed-count-txt { font-size: 11px; color: var(--text3); }
  .teams-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .team-card-2 {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 12px;
    text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .team-card-2:active { background: var(--bg-card2); border-color: rgba(0,212,255,0.3); }
  .tc-flag { font-size: 36px; }
  .tc-name { font-size: 13px; font-weight: 700; color: var(--text); }
  .tc-code { font-size: 10px; color: var(--text3); letter-spacing: 1.5px; }
  .tc-group {
    font-size: 9px; font-weight: 700; letter-spacing: 1px;
    background: rgba(255,184,0,0.1); color: var(--gold);
    padding: 2px 7px; border-radius: 4px;
    text-transform: uppercase;
  }

  /* ─── PLAYERS ─── */
  .players-search-wrap {
    position: relative; margin-bottom: 12px;
  }
  .players-search {
    width: 100%; padding: 10px 16px 10px 38px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text); font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none; transition: border-color 0.2s;
  }
  .players-search:focus { border-color: rgba(0,212,255,0.4); }
  .players-search::placeholder { color: var(--text3); }
  .search-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    font-size: 15px; color: var(--text3); pointer-events: none;
  }
  .pos-filter {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px;
    scrollbar-width: none;
  }
  .pos-filter::-webkit-scrollbar { display: none; }
  .pos-btn {
    flex-shrink: 0; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text2);
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }
  .pos-btn.active {
    background: rgba(0,212,255,0.12);
    border-color: rgba(0,212,255,0.35);
    color: var(--accent);
  }
  .players-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .player-card-2 {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative; overflow: hidden;
  }
  .player-card-2:active { border-color: rgba(0,212,255,0.3); }
  .player-watch-badge {
    position: absolute; top: 10px; right: 10px;
    font-size: 9px; font-weight: 700;
    background: rgba(255,184,0,0.15); color: var(--gold);
    border: 1px solid rgba(255,184,0,0.3);
    padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px;
  }
  .pc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pc-num {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: var(--accent);
    flex-shrink: 0;
  }
  .pc-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-country { font-size: 10px; color: var(--text3); margin-top: 2px; display: flex; align-items: center; gap: 3px; }
  .pc-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .pc-tag {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 999px;
  }
  .tag-pos-fwd { background: rgba(255,77,77,0.12); color: #FF8080; }
  .tag-pos-mid { background: rgba(0,212,255,0.1); color: var(--accent); }
  .tag-pos-def { background: rgba(74,222,128,0.1); color: var(--accent2); }
  .tag-pos-gk { background: rgba(255,184,0,0.1); color: var(--gold); }
  .tag-age { background: rgba(255,255,255,0.06); color: var(--text2); }
  .tag-club { background: rgba(255,255,255,0.06); color: var(--text2); font-size: 9px; }
  .no-results { grid-column: 1/-1; text-align: center; padding: 40px 0; color: var(--text3); font-size: 14px; }

  /* ─── BOTTOM NAV ─── */
  .bottom-nav {
    flex-shrink: 0;
    height: var(--bottom-nav-h);
    background: #0D1220;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: stretch;
    z-index: 20;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-tab {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer;
    color: var(--text3);
    transition: color 0.15s;
    border: none; background: none; font-family: 'Inter', sans-serif;
    padding: 0; position: relative;
  }
  .nav-tab.active { color: var(--accent); }
  .nav-tab.active::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 32px; height: 2px;
    background: var(--accent);
    border-radius: 0 0 2px 2px;
  }
  .nav-tab svg { width: 22px; height: 22px; }
  .nav-tab span { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }

  /* ─── MODAL ─── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
    align-items: flex-end; justify-content: center;
    padding: 0;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: #131929;
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px;
    max-height: 85vh; overflow-y: auto;
    padding-bottom: env(safe-area-inset-bottom, 16px);
  }
  .modal-drag {
    width: 40px; height: 4px; background: rgba(255,255,255,0.12);
    border-radius: 2px; margin: 12px auto 0;
  }
  .modal-hdr {
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: #131929; z-index: 1;
  }
  .modal-ttl { font-size: 17px; font-weight: 700; color: var(--text); }
  .modal-close-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.07); border: none;
    color: var(--text2); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-bdy { padding: 16px 20px 20px; }
  .info-row {
    display: flex; gap: 10px; margin-bottom: 10px;
  }
  .info-tile {
    flex: 1; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px;
  }
  .info-tile-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .info-tile-val { font-size: 17px; font-weight: 700; color: var(--text); }
  .squad-section { margin-bottom: 14px; }
  .squad-sec-lbl { font-size: 11px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .squad-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.03); margin-bottom: 4px;
  }
  .squad-n { font-family: monospace; font-size: 15px; color: var(--gold); width: 22px; text-align: center; flex-shrink: 0; }
  .squad-nm { flex: 1; font-size: 13px; color: var(--text); }
  .squad-pos-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }

  /* hero stats strip */
  .hero-strip {
    display: flex; gap: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 18px;
    overflow: hidden;
  }
  .hero-stat-item {
    flex: 1; text-align: center; padding: 12px 6px;
    border-right: 1px solid var(--border);
  }
  .hero-stat-item:last-child { border-right: none; }
  .hero-stat-n { font-size: 20px; font-weight: 800; color: var(--gold); line-height: 1; }
  .hero-stat-l { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }

  /* confed color helpers */
  .confed-UEFA   { border-left-color: #4A90E2; }
  .confed-CONMEBOL { border-left-color: #27AE60; }
  .confed-CAF    { border-left-color: #E67E22; }
  .confed-AFC    { border-left-color: #9B59B6; }
  .confed-CONCACAF { border-left-color: #E74C3C; }
  .confed-OFC    { border-left-color: #1ABC9C; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-top">
      <!-- World Cup Trophy/Ball Logo SVG -->
      <div class="wc-logo">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#0B1420" stroke="#FFB800" stroke-width="2"/>
          <!-- Soccer ball design -->
          <circle cx="50" cy="50" r="30" fill="#1A2540" stroke="#FFB800" stroke-width="1.5"/>
          <path d="M50 20 L57 30 L67 30 L60 38 L63 48 L53 43 L43 48 L47 38 L40 30 L50 30 Z" fill="#FFB800" stroke="#FFB800" stroke-width="0.5" stroke-linejoin="round"/>
          <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(255,184,0,0.2)" stroke-width="0.5"/>
          <!-- Stars -->
          <text x="50" y="74" text-anchor="middle" font-size="8" fill="#FFB800" opacity="0.7">★ ★ ★ ★</text>
          <!-- Trophy handles suggested -->
          <path d="M28 44 Q20 44 20 52 Q20 60 28 60" stroke="#00D4FF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M72 44 Q80 44 80 52 Q80 60 72 60" stroke="#00D4FF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-title">FIFA World Cup <span>2026</span></div>
      <div class="header-sub">USA · Canada · Mexico</div>
      <div class="live-pill">
        <div class="live-dot"></div>
        LIVE UPDATES
      </div>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <div class="page-scroll" id="page-scroll">

    <!-- ═══ MATCHES PAGE ═══ -->
    <div id="page-matches" class="page active">
      <div class="hero-strip">
        <div class="hero-stat-item"><div class="hero-stat-n">48</div><div class="hero-stat-l">Teams</div></div>
        <div class="hero-stat-item"><div class="hero-stat-n">104</div><div class="hero-stat-l">Matches</div></div>
        <div class="hero-stat-item"><div class="hero-stat-n">16</div><div class="hero-stat-l">Venues</div></div>
        <div class="hero-stat-item"><div class="hero-stat-n">39</div><div class="hero-stat-l">Days</div></div>
      </div>
      <div class="section-label">SCHEDULE &amp; UPDATES (WC 2026)</div>
      <div id="matches-container"></div>
    </div>

    <!-- ═══ STANDINGS PAGE ═══ -->
    <div id="page-standings" class="page">
      <div class="section-label">GROUP STANDINGS</div>
      <div id="standings-container"></div>

function etToBD(etStr) {
  const [time, period] = etStr.split(' ');
  const [h, m] = time.split(':').map(Number);
  let hour24 = h % 12 + (period === 'PM' ? 12 : 0);
  let bdHour = (hour24 + 10) % 24;
  let nextDay = (hour24 + 10) >= 24;
  const ampm = bdHour >= 12 ? 'PM' : 'AM';
  const bdH = bdHour % 12 || 12;
  return `${bdH}:${m.toString().padStart(2,'0')} ${ampm}${nextDay ? ' (+1)' : ''}`;
}

  { name:'AFC (Asia)', short:'AFC', color:'#9B59B6' },

// ============================================================
// STATE & NAVIGATION
// ============================================================
let currentPosFilter = 'ALL';
let currentPage = 'matches';

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('page-scroll').scrollTop = 0;
  currentPage = name;
}

// ============================================================
// RENDER MATCHES
// ============================================================
function renderMatches() {
  const grouped = {};
  MATCHES.forEach(m => {
    if (!grouped[m.date]) grouped[m.date] = [];
    grouped[m.date].push(m);
  });
  const c = document.getElementById('matches-container');
  c.innerHTML = Object.entries(grouped).map(([date, matches]) => `
    <div class="day-block">
      <div class="day-header">📅 ${date}</div>
      ${matches.map(m => {
        const isLive = m.status === 'live';
        const isFinal = m.status === 'final';
        const bdTime = etToBD(m.time_et);
        let statusHtml = '';
        if (isLive) statusHtml = `<span class="status-badge badge-live">● LIVE</span>`;
        else if (isFinal) statusHtml = `<span class="status-badge badge-final">FINAL</span>`;
        else statusHtml = `<span class="status-badge badge-upcoming">UPCOMING</span>`;
        let scoreHtml = '';
        if (m.score) {
          scoreHtml = `<div class="score-nums">${m.score.home} – ${m.score.away}</div>`;
        } else {
          scoreHtml = `
            <div class="score-nums upcoming">VS</div>
            <div class="score-time-lbl">Intl Time:<br>🕐 ${m.time_et} EDT</div>
          `;
        }
        return `
          <div class="match-card ${isLive?'live':''} ${isFinal?'completed':''}" onclick="showMatchDetail(${m.id})">
            <div class="match-card-top">
              <div class="match-venue-txt">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                ${m.venue}
              </div>
              ${statusHtml}
            </div>
            <div class="match-body">
              <div class="team-left">
                <div class="team-flag-big">${m.home.flag}</div>
                <div class="team-detail-left">
                  <div class="t-name">${m.home.name}</div>
                  <div class="t-code">${m.home.code}</div>
                </div>
              </div>
              <div class="score-box">
                ${scoreHtml}
              </div>
              <div class="team-right">
                <div class="team-flag-big">${m.away.flag}</div>
                <div class="team-detail-right">
                  <div class="t-name">${m.away.name}</div>
                  <div class="t-code">${m.away.code}</div>
                </div>
              </div>
            </div>
            <div class="match-times-row">
              <span class="group-chip">GROUP ${m.group}</span>
              <span class="time-chip"><strong>BD:</strong> ${bdTime} <small style="color:#5C6B8A">GMT+6</small></span>
              <span class="time-chip">🇺🇸 ${m.time_et} ET</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');
}

function showMatchDetail(id) {
  const m = MATCHES.find(x => x.id === id);
  if (!m) return;
  const bdTime = etToBD(m.time_et);
  document.getElementById('modal-title').textContent = `${m.home.flag} ${m.home.code} vs ${m.away.code} ${m.away.flag}`;
  document.getElementById('modal-body').innerHTML = `
    <div class="info-row">
      <div class="info-tile"><div class="info-tile-lbl">Group</div><div class="info-tile-val" style="color:#FFB800">GROUP ${m.group}</div></div>
      <div class="info-tile"><div class="info-tile-lbl">Status</div><div class="info-tile-val" style="font-size:14px;text-transform:capitalize">${m.status}</div></div>
    </div>
    <div class="info-row">
      <div class="info-tile"><div class="info-tile-lbl">Time (ET)</div><div class="info-tile-val" style="font-size:15px">${m.time_et}</div></div>
      <div class="info-tile"><div class="info-tile-lbl">Time (BD)</div><div class="info-tile-val" style="font-size:15px;color:#00D4FF">${bdTime}</div></div>
    </div>
    <div class="info-tile" style="margin-bottom:10px"><div class="info-tile-lbl">Venue</div><div class="info-tile-val" style="font-size:14px;font-weight:600">${m.venue}</div></div>
    <div style="display:flex;gap:10px;align-items:center;justify-content:center;padding:16px 0;">
      <div style="text-align:center;flex:1">
        <div style="font-size:40px">${m.home.flag}</div>
        <div style="font-size:16px;font-weight:700;margin-top:6px">${m.home.name}</div>
        <div style="font-size:11px;color:#5C6B8A">${m.home.code}</div>
      </div>
      <div style="font-size:22px;font-weight:800;color:#5C6B8A;padding:0 10px">VS</div>
      <div style="text-align:center;flex:1">
        <div style="font-size:40px">${m.away.flag}</div>
        <div style="font-size:16px;font-weight:700;margin-top:6px">${m.away.name}</div>
        <div style="font-size:11px;color:#5C6B8A">${m.away.code}</div>
      </div>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

// ============================================================
// RENDER STANDINGS
// ============================================================
function renderStandings() {
  const c = document.getElementById('standings-container');
  c.innerHTML = Object.entries(TEAMS).map(([grp, teams]) => `
    <div class="standing-block">
      <div class="standing-group-hdr">
        <span class="sg-title">GROUP ${grp}</span>
        <span class="sg-cols">P &nbsp; W &nbsp; D &nbsp; L &nbsp; GD &nbsp; Pts</span>
      </div>
      <div class="standing-table-wrap">
        <div class="qualify-note">🟢 Top 2 advance to Round of 32</div>
        ${teams.map((t, i) => {
          const isQ = i < 2;
          return `
            <div class="st-row ${isQ?'qualify':''}" onclick="showTeamSquad('${t.name}')">
              <div class="st-rank ${isQ?'q':'n'}">${i+1}</div>
              <div class="st-team">
                <span class="st-flag">${t.flag}</span>
                <span class="st-tname">${t.name}</span>
              </div>
              <div class="st-num">0</div>
              <div class="st-num">0</div>
              <div class="st-num">0</div>
              <div class="st-num">0</div>
              <div class="st-num">0</div>
              <div class="st-pts">0</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');
}

// ============================================================
// RENDER TEAMS
// ============================================================
function renderTeams() {
  const all48 = Object.entries(TEAMS);
  const byConfed = {};
  all48.forEach(([grp, teams]) => {
    teams.forEach(t => {
      const cf = t.cf;
      if (!byConfed[cf]) byConfed[cf] = [];
      if (!byConfed[cf].find(x => x.code === t.code)) {
        byConfed[cf].push({...t, group: grp});
      }
    });
  });
  const order = ['UEFA','CONMEBOL','CAF','AFC','CONCACAF','OFC'];
  const c = document.getElementById('teams-container');
  c.innerHTML = order.map(cf => {
    const teams = byConfed[cf] || [];
    const conf = CONFEDERATIONS.find(x => x.short === cf);
    return `
      <div class="confed-section">
        <div class="confed-hdr confed-${cf}">
          <div class="confed-name-txt">${conf ? conf.name : cf}</div>
          <div class="confed-count-txt">${teams.length} teams</div>
        </div>
        <div class="teams-grid-2">
          ${teams.map(t => `
            <div class="team-card-2" onclick="showTeamSquad('${t.name}')">
              <div class="tc-flag">${t.flag}</div>
              <div class="tc-name">${t.name}</div>
              <div class="tc-code">${t.code}</div>
              <div class="tc-group">GRP ${t.group}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function showTeamSquad(name) {
  const squad = SQUADS[name];
  if (!squad) {
    document.getElementById('modal-title').textContent = name;
    document.getElementById('modal-body').innerHTML = `<p style="color:#A0AECB;font-size:14px;padding:10px 0;">Squad details coming soon. FIFA announces official rosters closer to the tournament.</p>`;
    document.getElementById('modal-overlay').classList.add('open');
    return;
  }
  const gks = squad.players.filter(p => p.pos==='GK');
  const defs = squad.players.filter(p => p.pos==='DEF');
  const mids = squad.players.filter(p => p.pos==='MID');
  const fwds = squad.players.filter(p => p.pos==='FWD');
  const posCls = {GK:'tag-pos-gk',DEF:'tag-pos-def',MID:'tag-pos-mid',FWD:'tag-pos-fwd'};
  document.getElementById('modal-title').textContent = `${squad.flag} ${name} — Squad`;
  document.getElementById('modal-body').innerHTML = [
    ['Goalkeepers',gks,'GK'],['Defenders',defs,'DEF'],['Midfielders',mids,'MID'],['Forwards',fwds,'FWD']
  ].map(([lbl, players, pos]) => `
    <div class="squad-section">
      <div class="squad-sec-lbl">${lbl} (${players.length})</div>
      ${players.map(p => `
        <div class="squad-row">
          <div class="squad-n">${p.num}</div>
          <div class="squad-nm">${p.name}</div>
          <span class="squad-pos-badge pc-tag ${posCls[p.pos]||''}">${p.pos}</span>
        </div>
      `).join('')}
    </div>
  `).join('');
  document.getElementById('modal-overlay').classList.add('open');
}

// ============================================================
// RENDER PLAYERS
// ============================================================
function renderPlayers() {
  const search = document.getElementById('player-search').value.toLowerCase();
  const filtered = PLAYERS.filter(p => {
    const mp = currentPosFilter === 'ALL' || p.pos === currentPosFilter;
    const ms = !search || p.name.toLowerCase().includes(search) || p.country.toLowerCase().includes(search) || p.club.toLowerCase().includes(search);
    return mp && ms;
  });
  const posCls = {FWD:'tag-pos-fwd',MID:'tag-pos-mid',DEF:'tag-pos-def',GK:'tag-pos-gk'};
  const c = document.getElementById('players-container');
  if (!filtered.length) {
    c.innerHTML = `<div class="no-results">No players found</div>`;
    return;
  }
  c.innerHTML = filtered.map(p => `
    <div class="player-card-2" onclick="showPlayerDetail('${p.name.replace(/'/g,"\\'")}')">
      ${p.watch ? '<div class="player-watch-badge">⭐ WATCH</div>' : ''}
      <div class="pc-top">
        <div class="pc-num">${p.num}</div>
        <div>
          <div class="pc-name">${p.name}</div>
          <div class="pc-country"><span>${p.flag}</span>${p.country}</div>
        </div>
      </div>
      <div class="pc-tags">
        <span class="pc-tag ${posCls[p.pos]||''}">${p.pos}</span>
        <span class="pc-tag tag-age">${p.age} yrs</span>
        <span class="pc-tag tag-club">${p.club}</span>
      </div>
    </div>
  `).join('');
}

function setPos(pos, btn) {
  currentPosFilter = pos;
  document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPlayers();
}

function showPlayerDetail(name) {
  const p = PLAYERS.find(x => x.name === name);
  if (!p) return;
  const posCls = {FWD:'tag-pos-fwd',MID:'tag-pos-mid',DEF:'tag-pos-def',GK:'tag-pos-gk'};
  document.getElementById('modal-title').textContent = `${p.flag} ${p.name}`;
  document.getElementById('modal-body').innerHTML = `
    <div class="info-row">
      <div class="info-tile"><div class="info-tile-lbl">Position</div><div class="info-tile-val"><span class="pc-tag ${posCls[p.pos]||''}" style="font-size:14px;padding:4px 12px">${p.pos}</span></div></div>
      <div class="info-tile"><div class="info-tile-lbl">Age</div><div class="info-tile-val">${p.age} yrs</div></div>
      <div class="info-tile"><div class="info-tile-lbl">Shirt</div><div class="info-tile-val" style="color:#FFB800">#${p.num}</div></div>
    </div>
    <div class="info-tile" style="margin-bottom:10px">
      <div class="info-tile-lbl">Club</div>
      <div class="info-tile-val" style="font-size:15px;font-weight:600">🏟 ${p.club}</div>
    </div>
    <div class="info-tile" style="margin-bottom:10px">
      <div class="info-tile-lbl">Nation</div>
      <div class="info-tile-val" style="font-size:15px;font-weight:600">${p.flag} ${p.country}</div>
    </div>
    ${p.watch ? `
    <div style="background:rgba(255,184,0,0.08);border:1px solid rgba(255,184,0,0.2);border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="font-size:13px;color:#FFB800">⭐ Key Player to Watch at World Cup 2026</div>
    </div>` : ''}
  `;
  document.getElementById('modal-overlay').classList.add('open');
}

// ============================================================
// MODAL
// ============================================================
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function closeModalOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// ============================================================
// INIT
// ============================================================
renderMatches();
renderStandings();
renderTeams();
renderPlayers();
</script>
